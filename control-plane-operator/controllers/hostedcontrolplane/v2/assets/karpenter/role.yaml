apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: karpenter
  namespace: HCP_NAMESPACE
rules:
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - "leases"
    verbs:
      - "get"
      - "watch"
      - "create"
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - "leases"
    verbs:
      - "patch"
      - "update"
    resourceNames:
      - "karpenter-leader-election"
  - apiGroups:
      - "karpenter.k8s.aws"
    resources:
      - "ec2nodeclasses"
      - "ec2nodeclasses/status"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"
  - apiGroups:
      - ""
    resources:
      - "events"
    verbs:
      - "create"
      - "update"
      - "patch"